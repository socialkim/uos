<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서울시립대 수업 · 김덕진</title>
<meta name="description" content="서울시립대 김덕진 교수 수업 모음 — 학기별 수업 포털">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--ground:#fff;--surface:#F7F6F5;--ink:#181818;--ink-2:#3A3735;--muted:#6E6A68;--faint:#A5A09D;--line:#E6E3E1;--accent:#FF5A4F}
@media (prefers-color-scheme:dark){:root{--ground:#151413;--surface:#1E1C1B;--ink:#EDEAE8;--ink-2:#D3CECB;--muted:#9A9491;--faint:#6E6865;--line:#2E2B29;--accent:#FF6B60}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:56px 24px 40px}
@media (max-width:520px){.wrap{padding:36px 16px}}
.k{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--faint);letter-spacing:.08em}
h1{font-size:clamp(26px,5vw,36px);margin:8px 0 36px;letter-spacing:-.01em}
h2{font-size:13px;color:var(--muted);margin:40px 0 10px;font-weight:600}
a.cur{display:block;text-decoration:none;color:var(--ground);background:var(--ink);border-radius:14px;padding:26px 26px 24px}
a.cur .t{font-size:clamp(22px,4vw,28px);font-weight:700;margin:6px 0 4px}
a.cur .d{opacity:.75;font-size:14px}
a.cur .go{display:inline-block;margin-top:16px;font-weight:600;font-size:14px;border-bottom:2px solid var(--accent)}
.pill{display:inline-block;background:var(--accent);color:#fff;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px}
.row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.row:last-child{border-bottom:1px solid var(--line)}
.row span{color:var(--muted);font-size:14px;white-space:nowrap}
footer{margin-top:56px;font-size:12px;color:var(--faint)}
footer a{color:var(--muted)}
</style>
</head>
<body><main class="wrap">
<div class="k">UNIVERSITY OF SEOUL · 김덕진</div>
<h1>서울시립대 수업</h1>
<div id="app"></div>
<footer>김덕진 · <a href="https://socialkim.github.io/">IT커뮤니케이션연구소</a></footer>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('courses.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{
  const cur=d.courses.filter(c=>c.current), past=d.courses.filter(c=>!c.current);
  let h=cur.map(c=>'<a class="cur" href="'+esc(c.slug)+'/"><span class="pill">지금 수업 중</span><div class="t">'+esc(c.title)+'</div><div class="d">'+esc(c.term)+' · '+esc(c.desc)+'</div><span class="go">수업 포털 열기 →</span></a>').join('<div style="height:12px"></div>');
  if(past.length)h+='<h2>지난 학기</h2>'+past.map(c=>'<a class="row" href="'+esc(c.slug)+'/"><b>'+esc(c.title)+'</b><span>'+esc(c.term)+'</span></a>').join('');
  document.getElementById('app').innerHTML=h;
}).catch(()=>{document.getElementById('app').textContent='courses.json을 읽지 못했습니다.'});
</script>
</body></html>
